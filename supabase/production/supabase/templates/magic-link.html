<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#fff4f7;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#3d1f33;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fff4f7;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:16px;padding:28px;">
            <tr>
              <td>
                <p style="margin:0 0 4px;font-size:15px;font-weight:700;color:#c2306a;">Budget</p>
                <h1 style="margin:0 0 12px;font-size:24px;line-height:1.2;">Sign in to Budget</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#7a5068;">
                  Tap the button to sign in. The link works once and expires in an hour.
                </p>
                <a href="{{ .ConfirmationURL }}"
                   style="display:inline-block;background:#c2306a;color:#ffffff;text-decoration:none;font-weight:700;font-size:16px;padding:14px 22px;border-radius:12px;">
                  Sign in
                </a>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#7a5068;">
                  Didn't ask for this? You can ignore this email; nobody can sign in without the link.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
